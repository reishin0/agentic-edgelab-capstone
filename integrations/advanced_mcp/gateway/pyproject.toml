[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advanced-mcp"
version = "0.1.0"
description = "Local MCP gateway with governed discovery and isolated backend connections"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "uvicorn>=0.34,<1", "pyyaml>=6,<7", "prometheus-client>=0.22,<1", "pyjwt[crypto]>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
analysis = ["faster-whisper==1.2.1", "imageio-ffmpeg==0.6.0"]

[project.scripts]
advanced-mcp = "advanced_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
