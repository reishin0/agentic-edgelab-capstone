host: 127.0.0.1
port: 8798
surface: classic
allowed_hosts: ["127.0.0.1", "localhost"]
allowed_origins: ["http://127.0.0.1:8798", "http://localhost:8798"]
requests_per_minute: 60
auth:
  mode: local_tokens
  tokens:
    - env: ADVANCED_MCP_EDGELAB_READER_TOKEN
      subject: edgelab-research-reader
      roles: [edgelab-reader]
backends:
  - name: edgelab
    kind: openapi
    url: http://127.0.0.1:8799/v1
    spec_file: edgelab.openapi.json
    roles: [edgelab-reader]
    allowed_tools: [listRuns, getRunReport]
    read_only_tools: [listRuns, getRunReport]
    token_env: EDGELAB_READER_SERVICE_TOKEN
    max_response_bytes: 32768
    pool_size: 2
    queue_size: 8
    timeout_seconds: 5
